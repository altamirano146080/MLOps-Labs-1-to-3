name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Continuous integration: format, lint and tests on every push and pull request
  build:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with cache of the dependencies)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install packages (fails if uv.lock is out of date)
        run: make install

      - name: Check format
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test (with minimum coverage)
        run: make test
