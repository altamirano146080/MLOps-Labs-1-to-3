[project]
name = "mlops-lab1-image-classifier"
version = "0.1.0"
description = "Image classifier with reusable logic, a CLI, and a FastAPI REST API, tested with pytest and checked in a CI pipeline"
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies: needed to run the CLI and the API
dependencies = [
    "click>=8.3.0",
    "fastapi>=0.119.1",
    "jinja2>=3.1.6",
    "pillow>=11.0.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

# Development dependencies: installed by `uv sync` (default group), not needed to run the app
[dependency-groups]
dev = [
    "black>=25.9.0",
    "httpx>=0.28.1",      # needed by FastAPI's TestClient
    "pylint>=4.0.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]